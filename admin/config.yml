# Questa sezione va sostituita con lo snippet generato da DecapBridge
# (decapbridge.com) dopo aver registrato questo sito nella loro dashboard.
# Nel frattempo il backend resta configurato su "git-gateway" come placeholder.
backend: { name: git-gateway, repo: Veerlysiti/veerly-sito, branch: main }

publish_mode: simple
media_folder: "src/assets/img"
public_folder: "/assets/img"

